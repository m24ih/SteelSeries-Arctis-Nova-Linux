[package]
name = "arctis-windows-hid-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hidapi = "2.6"
cpal = "0.15"
ctrlc = "3.2"
windows-core = "0.62"
usbip-audio = { git = "https://github.com/network-audio/usbip-audio.git", rev = "58032ab0664ffec1d0c178f40a3a69359c21f597" }
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Globalization"] }
